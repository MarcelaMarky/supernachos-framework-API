<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos/plantilla :: cabeza('Producto')}"></head>

<body>
	<header th:replace="~{fragmentos/plantilla :: menu('productos')}"></header>

	<main>
		<h1 th:text="${producto.idProducto == null} ? 'Nuevo producto' : 'Editar producto'">Nuevo producto</h1>
		<p class="subtitulo">Los campos marcados son obligatorios.</p>

		<div class="tarjeta">
			<form method="post" th:action="@{/productos/guardar}" th:object="${producto}">
				<input type="hidden" th:field="*{idProducto}">

				<div class="campo">
					<label for="nombre">Nombre</label>
					<input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Nachos con queso">
					<div class="error-campo" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
				</div>

				<div class="campo">
					<label for="categoria">Categoria</label>
					<input type="text" id="categoria" th:field="*{categoria}" placeholder="Ej: Snacks">
					<div class="error-campo" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
				</div>

				<div class="rejilla-2">
					<div class="campo">
						<label for="precio">Precio</label>
						<input type="number" step="0.01" min="0" id="precio" th:field="*{precio}">
						<div class="error-campo" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
					</div>
					<div class="campo">
						<label for="stock">Stock</label>
						<input type="number" min="0" id="stock" th:field="*{stock}">
						<div class="error-campo" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
					</div>
				</div>

				<div class="acciones" style="justify-content:flex-start;">
					<button class="boton" type="submit">Guardar</button>
					<a class="boton secundario" th:href="@{/productos}">Cancelar</a>
				</div>
			</form>
		</div>
	</main>

	<footer th:replace="~{fragmentos/plantilla :: pie}"></footer>
</body>

</html>
