spring.application.name=supernachos

# ---------------------------------------------------------------
# Base de datos MySQL (misma base del proyecto de la fase anterior)
# Si tu MySQL tiene otro usuario o clave, cambialos aqui o definelos
# como variables de entorno DB_USER y DB_PASSWORD.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/supernachos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:marky}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate: valida y completa el esquema sin borrar datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf en modo desarrollo (sin cache de plantillas)
spring.thymeleaf.cache=false

server.port=8080
