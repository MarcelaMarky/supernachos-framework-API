# Las pruebas usan una base H2 en memoria para no tocar la base real de MySQL.
spring.datasource.url=jdbc:h2:mem:pruebas;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Igual que en la configuracion principal: la sesion viaja solo en la cookie.
server.servlet.session.tracking-modes=cookie
